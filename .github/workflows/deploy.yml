---
name: Deploy application to server

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: "Tag to deploy (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: write

concurrency:
  group: straperr-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  deploy:
    name: Deploy to server
    uses: francisjgarcia/actions-templates/.github/workflows/wf-deploy.yml@main
    secrets:
      APP_ENV_SECRETS: ${{ secrets.APP_ENV_SECRETS }}
    with:
      tag_version: ${{ inputs.tag_version }}
      github_repository: ${{ github.repository }}
      containers: |
        [
          {
            "name": "straperr",
            "image": "ghcr.io/${{ github.repository }}:${{ inputs.tag_version }}",
            "healthcheck_url": "${{ vars.DOCKER_HEALTHCHECK_URL }}",
            "memory_limit": "${{ vars.DOCKER_MEMORY_LIMIT }}",
            "memory_reservation": "${{ vars.DOCKER_MEMORY_RESERVATION }}",
            "network": "${{ vars.DOCKER_NETWORK }}",
            "env_vars": {
              "PUID": "1000",
              "PGID": "1000",
              "TZ": "Europe/Madrid",
              "FLASK_ENV": "${{ vars.FLASK_ENV }}",
              "FLASK_DEBUG": "${{ vars.FLASK_DEBUG }}",
              "SONARR_API_URL": "${{ vars.SONARR_API_URL }}",
              "SONARR4K_API_URL": "${{ vars.SONARR4K_API_URL }}",
              "RADARR_API_URL": "${{ vars.RADARR_API_URL }}",
              "RADARR4K_API_URL": "${{ vars.RADARR4K_API_URL }}"
            }
          }
        ]
