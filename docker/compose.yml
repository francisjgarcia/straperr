services:
  straperr:
    container_name: straperr
    hostname: straperr
    image: ghcr.io/francisjgarcia/straperr:local
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        INSTALL_DEV_TOOLS: "true"
    ports:
      - ${STRAPERR_PORT:-5000}:5000
    volumes:
      - ../src:/app
      - ../tests:/app/tests
    env_file:
      - .env
      - ../src/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/status"]
      start_period: 30s
      interval: 1h
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 700M
        reservations:
          memory: 300M
    restart: on-failure
